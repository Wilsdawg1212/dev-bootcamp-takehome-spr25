<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css" >
  <title>Profile Card</title>
</head>
<body>
  <div class="card-container">
    <div class="card">
      <!-- Front Side -->
      <div class="card-front">
        <div class="profile-pic"></div>
        <div class="info">
          <h2>Wilson Ide</h2>
          <p>Computer Science Major</p>
          <p>Second-Year Student</p>
          <p>Passionate about helping to solve root causes to large problems.</p>
        </div>
      </div>

      <!-- Back Side -->
      <div class="card-back">
        <div class="info">
          <h2>Surprise!</h2>
          <p>I'm an Atlanta native from not too far away.</p>
          <p>Just like this card, there's more to me.</p>
          <p>I would absolutely love to be a part of this bootcamp!</p>
          <p></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
